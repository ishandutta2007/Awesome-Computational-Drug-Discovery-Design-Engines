<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .node-pulse {
        animation: pulse 3s infinite ease-in-out alternate;
      }
      .node-pulse-2 {
        animation: pulse 4s infinite ease-in-out alternate-reverse;
      }
      .orbit-1 {
        transform-origin: 1020px 210px;
        animation: spin 16s linear infinite;
      }
      .orbit-2 {
        transform-origin: 1020px 210px;
        animation: spinRev 22s linear infinite;
      }
      .wave-float {
        animation: float 6s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.96); opacity: 0.6; }
        100% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinRev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Background dynamic decorative glow meshes -->
  <g opacity="0.35" class="wave-float">
    <circle cx="150" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.25" />
    <circle cx="1020" cy="210" r="180" fill="#818cf8" filter="url(#glow)" opacity="0.22" />
    <circle cx="600" cy="380" r="160" fill="#c084fc" filter="url(#glow)" opacity="0.18" />
  </g>

  <!-- Animated Molecular Orbit & Graph Representation on Right Side (background decorative) -->
  <g class="orbit-1" opacity="0.55">
    <ellipse cx="1020" cy="210" rx="140" ry="55" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6,6" />
    <circle cx="1160" cy="210" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="880" cy="210" r="5" fill="#818cf8" filter="url(#glow)" />
  </g>
  <g class="orbit-2" opacity="0.45">
    <ellipse cx="1020" cy="210" rx="110" ry="140" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="8,8" />
    <circle cx="1020" cy="70" r="5.5" fill="#c084fc" filter="url(#glow)" />
    <circle cx="1020" cy="350" r="6" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Molecular Structure Graph Centerpiece in Right Zone -->
  <g opacity="0.85" class="node-pulse">
    <!-- Chemical bonds -->
    <line x1="1020" y1="210" x2="960" y2="160" stroke="#818cf8" stroke-width="2.5" />
    <line x1="1020" y1="210" x2="1080" y2="160" stroke="#818cf8" stroke-width="2.5" />
    <line x1="1020" y1="210" x2="1020" y2="280" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="960" y1="160" x2="910" y2="185" stroke="#38bdf8" stroke-width="2" />
    <line x1="1080" y1="160" x2="1130" y2="185" stroke="#c084fc" stroke-width="2" />
    <line x1="1020" y1="280" x2="970" y2="315" stroke="#38bdf8" stroke-width="2" />
    <line x1="1020" y1="280" x2="1070" y2="315" stroke="#818cf8" stroke-width="2" />

    <!-- Atom Nodes -->
    <circle cx="1020" cy="210" r="14" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="960" cy="160" r="10" fill="#818cf8" />
    <circle cx="1080" cy="160" r="10" fill="#c084fc" />
    <circle cx="1020" cy="280" r="11" fill="#38bdf8" />
    <circle cx="910" cy="185" r="7" fill="#67e8f9" />
    <circle cx="1130" cy="185" r="7" fill="#a855f7" />
    <circle cx="970" cy="315" r="6" fill="#38bdf8" />
    <circle cx="1070" cy="315" r="6" fill="#c084fc" />
  </g>

  <!-- Foreground Content: Header, Badges, Title & Subtitles -->
  <!-- Pill Badge -->
  <g transform="translate(80, 55)">
    <rect width="360" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM FOR CADD &amp; AIDD</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 140)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Computational Drug Discovery
    </text>
    <text y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      &amp; Design Engines
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 240)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Virtual Screening • Generative Chemistry • Protein-Ligand Docking • ADMET
    </text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      Tracking Industry SaaS Leaders, Open Foundation Models, &amp; Open-Source Tools
    </text>
  </g>

  <!-- Feature Tags / Metric Pills -->
  <g transform="translate(80, 315)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🔬 Molecular Docking</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(182, 0)">
      <rect width="180" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🧬 Generative Design</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(374, 0)">
      <rect width="165" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">📊 ADMET Prediction</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(551, 0)">
      <rect width="165" height="36" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">⚡ Ultra-Large Screening</text>
    </g>
  </g>
</svg>
